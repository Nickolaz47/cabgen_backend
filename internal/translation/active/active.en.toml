[email.email_update_confirmation.subject]
other = "CABGen - Confirm Your New Email"

[email.email_update_confirmation.body]
other = """
<div style="font-family: Arial, sans-serif; color: #333;">
<h2>Confirm New Email - CABGen</h2>
<p>Hello, <strong>{{.Name}}</strong>,</p>
<p>We received a request to change the email for your CABGen account from <strong>{{.OldEmail}}</strong> to <strong>{{.NewEmail}}</strong>.</p>
<p>If you did not make this request, please ignore this email. Your email will remain the same.</p>
<p>To confirm the change, click the button below (this link expires in 15 minutes):</p>
<br>
<a href="{{.ConfirmLink}}" style="background-color: #0056b3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Confirm New Email</a>
<br><br>
<p><small>Or copy and paste the following link into your browser:</small><br>
<small><a href="{{.ConfirmLink}}">{{.ConfirmLink}}</a></small></p>
<hr>
<p>Best regards,<br><strong>CABGen Team</strong></p>
</div>"""

