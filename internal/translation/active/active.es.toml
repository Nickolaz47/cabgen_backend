other = "CABGen - Restablecimiento de Contraseña"

[email.password_reset.body]
other = """
<div style="font-family: Arial, sans-serif; color: #333;">
<h2>Restablecimiento de Contraseña - CABGen</h2>
<p>Hola, <strong>{{.Name}}</strong>,</p>
<p>Recibimos una solicitud para restablecer la contraseña de su cuenta en el sistema CABGen.</p>
<p>Si usted no realizó esta solicitud, por favor ignore este correo. Su contraseña permanecerá igual.</p>
<p>Para crear una nueva contraseña, haga clic en el botón de abajo (este enlace expira en 15 minutos):</p>
<br>
<a href="{{.ResetLink}}" style="background-color: #0056b3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Restablecer Mi Contraseña</a>
<br><br>
<p><small>O copie y pegue el siguiente enlace en su navegador:</small><br>
<small><a href="{{.ResetLink}}">{{.ResetLink}}</a></small></p>
<hr>
<p>Atentamente,<br><strong>Equipo CABGen</strong></p>
</div>"""

