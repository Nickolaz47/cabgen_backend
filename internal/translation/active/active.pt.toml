[email.email_update_confirmation.subject]
other = "CABGen - Confirme Seu Novo E-mail"

[email.email_update_confirmation.body]
other = """
<div style="font-family: Arial, sans-serif; color: #333;">
<h2>Confirmar Novo E-mail - CABGen</h2>
<p>Olá, <strong>{{.Name}}</strong>,</p>
<p>Recebemos uma solicitação para alterar o e-mail da sua conta no CABGen de <strong>{{.OldEmail}}</strong> para <strong>{{.NewEmail}}</strong>.</p>
<p>Se você não fez essa solicitação, por favor ignore este e-mail. Seu e-mail permanecerá o mesmo.</p>
<p>Para confirmar a alteração, clique no botão abaixo (este link expira em 15 minutos):</p>
<br>
<a href="{{.ConfirmLink}}" style="background-color: #0056b3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Confirmar Novo E-mail</a>
<br><br>
<p><small>Ou copie e cole o seguinte link no seu navegador:</small><br>
<small><a href="{{.ConfirmLink}}">{{.ConfirmLink}}</a></small></p>
<hr>
<p>Atenciosamente,<br><strong>Equipe CABGen</strong></p>
</div>"""

