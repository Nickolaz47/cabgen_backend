services:
  init-folders:
    image: alpine:latest
    container_name: app_init_folders
    command: >
      /bin/sh -c "
        mkdir -p /mnt/uploads /mnt/logs /mnt/databases /mnt/data/postgres /mnt/data/redis &&
        chown -R ${UID:-1000}:${GID:-1000} /mnt/uploads /mnt/logs /mnt/databases &&
        chmod -R 0750 /mnt/uploads /mnt/logs /mnt/databases
      "
    volumes:
      - ./uploads:/mnt/uploads
      - ./logs:/mnt/logs
      - ./databases:/mnt/databases
      - ./data/postgres:/mnt/data/postgres
      - ./data/redis:/mnt/data/redis
    restart: "no"

  api:
    user: "${UID:-1000}:${GID:-1000}"
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=database
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      init-folders:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  worker-email:
    user: "${UID:-1000}:${GID:-1000}"
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=database
    command: ["./worker-email"]
    depends_on:
      init-folders:
        condition: service_completed_successfully    
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker-analysis:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.analysis
    env_file:
      - .env
    environment:
      - DB_HOST=database
    depends_on:
      init-folders:
        condition: service_completed_successfully    
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./databases:/app/databases
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${ANALYSIS_CPU}'
          memory: '${ANALYSIS_RAM}'

  database:
    image: "postgres:15-alpine"
    depends_on:
      init-folders:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis/redis-stack:7.4.0-v8
    depends_on:
      init-folders:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
volumes:
  postgres-data:
  analysis-databases:
  analysis-uploads: