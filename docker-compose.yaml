version: '3'

services:
  api:
    user: "${UID:-1000}:${GID:-1000}"
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=database
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - proxy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.api-backend.rule=Host(`${API_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-backend.entrypoints=websecure"
      - "traefik.http.routers.api-backend.tls=true"
      - "traefik.http.routers.api-backend.middlewares=crowdsec-bouncer@docker"
      - "traefik.http.services.api-backend.loadbalancer.server.port=${PORT}"

  worker-email:
    user: "${UID:-1000}:${GID:-1000}"
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=database
    command: ["./worker-email"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker-analysis:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.analysis
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - TERM=xterm
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./databases:/app/databases
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${ANALYSIS_CPU}'
          memory: '${ANALYSIS_RAM}'

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

volumes:
  postgres-data:
  redis-data:

networks:
  proxy-network:
    external: true
  default:
    driver: bridge